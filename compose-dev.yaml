services:
  nginx-local:
    container_name: trx-nginx-dev
    image: nginx:latest
    networks:
      - trx-network
      - shared-gitlab-net
    ports:
        - "80:80"
        - "443:443"
    working_dir: /opt/app
    volumes:
      - ./deploy/cert/cert.pem:/etc/nginx/ssl/cert.pem
      - ./deploy/cert/key.pem:/etc/nginx/ssl/key.pem
      - ./deploy/docker/nginx/local.conf:/etc/nginx/conf.d/default.conf
      - ./:/opt/app
  php-local:
      container_name: trx-php-dev
      build: ./deploy/docker/php/dev
      user: "${UID:-1000}:${GID:-1000}"
      volumes:
          - ./:/opt/app
          - ./deploy/docker/php/dev/php.ini:/usr/local/etc/php/php.ini
      environment:
          - PHP_IDE_CONFIG=${PHP_IDE_CONFIG}
          - XDEBUG_HOST=${XDEBUG_HOST}
      working_dir: /opt/app
      networks:
          - trx-network
  postgres-local:
      image: postgres:latest
      container_name: trx-postgres-dev
      environment:
          - POSTGRES_USER=${POSTGRES_USER}
          - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          - POSTGRES_DB=${POSTGRES_DB}
      ports:
          - "5433:5432"
      volumes:
          - postgres_data:/var/lib/postgresql
      networks:
          - trx-network
  rabbitmq-local:
      image: rabbitmq:4.3.4-management
      container_name: trx-rabbitmq-dev
      environment:
          - RABBITMQ_DEFAULT_USER=${RABBIT_USER}
          - RABBITMQ_DEFAULT_PASS=${RABBIT_PASSWORD}
      ports:
          - "5672:5672"
          - "15672:15672"
      volumes:
          - rabbitmqlib:/var/lib/rabbitmq/
          - rabbitmqlogs:/var/log/rabbitmq
      networks:
          - trx-network
  redis:
      image: redis:7.4-alpine
      container_name: trx-redis-dev
      ports:
          - "6379:6379"
      volumes:
          - redis_data:/data
          - ./deploy/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-secret}
      environment:
          - REDIS_PASSWORD=${REDIS_PASSWORD:-secret}
      healthcheck:
          test: [ "CMD", "redis-cli", "ping" ]
          interval: 10s
          timeout: 5s
          retries: 3
      networks:
          - trx-network
networks:
    trx-network:
    shared-gitlab-net:
        external: true
        name: shared-gitlab-net

volumes:
    postgres_data:
    rabbitmqlib:
    rabbitmqlogs:
    redis_data:
