doctrine:
    dbal:
        default_connection: default
        url: '%env(resolve:DATABASE_URL)%'
        types:
            transporter_id: App\Modules\Transportation\Transporter\Infrastructure\Persistence\Doctrine\TransporterIdType
            transporter_company_id: App\Modules\Transportation\Transporter\Infrastructure\Persistence\Doctrine\TransporterCompanyIdType
            transporter_company_link_id: App\Modules\Transportation\Transporter\Infrastructure\Persistence\Doctrine\TransporterCompanyLinkIdType

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        entity_managers:
            default:
                connection: default
                auto_mapping: false
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                identity_generation_preferences:
                  Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                mappings:
                    Transporter:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/src/Modules/Transportation/Transporter/Domain/Entity'
                        prefix: 'App\Modules\Transportation\Transporter\Domain\Entity'
                        alias: Transporter
                    TransporterCompanyLink:
                      is_bundle: false
                      type: attribute
                      dir: '%kernel.project_dir%/src/Modules/Transportation/Transporter/Domain/Entity'
                      prefix: 'App\Modules\Transportation\Transporter\Domain\Entity'
                      alias: TransporterCompanyLink

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
