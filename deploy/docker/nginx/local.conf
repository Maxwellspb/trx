server {
    listen 80;
    server_name trx-dev.local;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trx-dev.local;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- НОВАЯ КОРНЕВАЯ ДИРЕКТОРИЯ ---
    root /opt/app/public;
    index index.php;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php-local:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # SCRIPT_FILENAME теперь указывает на /opt/app/public/...
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        fastcgi_intercept_errors on;
        internal;
    }

    # Запрет доступа к другим .php
    location ~ \.php$ {
        return 404;
    }

    # Защита скрытых файлов
    location ~ /\.(env|git|log|lock)$ {
        deny all;
    }
}
